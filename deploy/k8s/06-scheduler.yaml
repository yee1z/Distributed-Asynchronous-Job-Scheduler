# Scheduler. 2 replicas: one wins the Postgres advisory lock and leads, the
# other stands by and takes over automatically if the leader dies (failover).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: job-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      priorityClassName: system-node-critical
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping | grep -q PONG; do
                echo "waiting for redis"; sleep 2
              done
        - name: wait-migrations
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: scheduler-secret, key: POSTGRES_PASSWORD}
            - name: PGUSER
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_USER}
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_DB}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$PGUSER"; do
                echo "waiting for postgres"; sleep 2
              done
              until psql -h postgres -U "$PGUSER" -d "$PGDATABASE" \
                  -c "SELECT 1 FROM alembic_version" >/dev/null 2>&1; do
                echo "waiting for migrations"; sleep 2
              done
      containers:
        - name: scheduler
          image: job-scheduler:0.1.0
          imagePullPolicy: Never
          command: ["python", "-m", "backend.scheduler.main"]
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef: {name: scheduler-config}
            - secretRef: {name: scheduler-secret}
          livenessProbe:
            httpGet: {path: /, port: 9100}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-metrics
  namespace: job-scheduler
  labels:
    app: scheduler
spec:
  clusterIP: None
  selector:
    app: scheduler
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
