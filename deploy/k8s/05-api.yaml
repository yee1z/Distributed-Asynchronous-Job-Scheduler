# FastAPI REST API. Stateless -> 2 replicas for availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: job-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      priorityClassName: system-node-critical
      initContainers:
        - name: wait-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis ping | grep -q PONG; do
                echo "waiting for redis"; sleep 2
              done
        - name: wait-migrations
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: scheduler-secret, key: POSTGRES_PASSWORD}
            - name: PGUSER
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_USER}
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_DB}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$PGUSER"; do
                echo "waiting for postgres"; sleep 2
              done
              until psql -h postgres -U "$PGUSER" -d "$PGDATABASE" \
                  -c "SELECT 1 FROM alembic_version" >/dev/null 2>&1; do
                echo "waiting for migrations"; sleep 2
              done
      containers:
        - name: api
          image: job-scheduler:0.1.0
          imagePullPolicy: Never
          command:
            - uvicorn
            - backend.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: scheduler-config}
            - secretRef: {name: scheduler-secret}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: job-scheduler
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
      name: http
