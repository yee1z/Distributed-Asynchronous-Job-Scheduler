# Optional Prometheus exporters for database/server-level metrics.
# These complement the application metrics exposed by api/scheduler/worker.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      priorityClassName: system-node-critical
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_DB}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: scheduler-secret, key: POSTGRES_PASSWORD}
            - name: DATA_SOURCE_URI
              value: "postgres:5432/scheduler?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                configMapKeyRef: {name: scheduler-config, key: POSTGRES_USER}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: scheduler-secret, key: POSTGRES_PASSWORD}
          readinessProbe:
            httpGet: {path: /metrics, port: 9187}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: 9187}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: job-scheduler
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      priorityClassName: system-node-critical
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.67.0
          imagePullPolicy: IfNotPresent
          args:
            - --redis.addr=redis://redis:6379
          ports:
            - containerPort: 9121
              name: metrics
          readinessProbe:
            httpGet: {path: /metrics, port: 9121}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: 9121}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: job-scheduler
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121
      name: metrics
