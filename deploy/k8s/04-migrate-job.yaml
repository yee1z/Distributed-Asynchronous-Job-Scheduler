# One-shot schema migration. Runs `alembic upgrade head` once Postgres accepts
# connections. Re-applying is safe (Alembic is idempotent). Delete + re-apply
# this Job to run future migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: job-scheduler
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: migrate
    spec:
      priorityClassName: system-node-critical
      restartPolicy: OnFailure
      initContainers:
        # Use postgres:16-alpine (already running on this node). job-scheduler
        # image in initContainers hit containerd/NFS CreateContainer stalls.
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: scheduler-secret, key: POSTGRES_PASSWORD}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U scheduler; do
                echo "waiting for postgres"; sleep 2
              done
      containers:
        - name: migrate
          image: job-scheduler:0.1.0
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: scheduler-config}
            - secretRef: {name: scheduler-secret}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
