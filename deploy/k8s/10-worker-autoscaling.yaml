# KEDA autoscaling for workers. It scales the worker Deployment from at least
# 2 pods up to 20 pods based on Redis Stream job backlog and in-flight pressure.
#
# Prerequisite:
#   kubectl apply --server-side \
#     -f https://github.com/kedacore/keda/releases/download/v2.20.0/keda-2.20.0.yaml
#
# Emergency manual override:
#   kubectl -n job-scheduler annotate scaledobject worker-autoscaler \
#     autoscaling.keda.sh/paused-replicas="6" --overwrite
#   kubectl -n job-scheduler annotate scaledobject worker-autoscaler \
#     autoscaling.keda.sh/paused-replicas-
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-autoscaler
  namespace: job-scheduler
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 2
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      name: worker-autoscaler
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 8
              periodSeconds: 15
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
          selectPolicy: Min
  triggers:
    - type: redis-streams
      metadata:
        address: redis.job-scheduler.svc.cluster.local:6379
        databaseIndex: "0"
        stream: jobs:stream
        consumerGroup: workers
        lagCount: "20"
        activationLagCount: "1"
    - type: redis-streams
      metadata:
        address: redis.job-scheduler.svc.cluster.local:6379
        databaseIndex: "0"
        stream: jobs:stream
        consumerGroup: workers
        pendingEntriesCount: "20"
