# Local development / integration-test stack.
# Mirrors the k3s topology (Postgres + Redis + API + scheduler + worker) so the
# whole pipeline can be exercised without a cluster:  docker compose up --build
#
# Scheduler / worker images are the same as the API; they only override the
# command. Those services come online once stages A/B are implemented.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: job-scheduler:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: job-scheduler:dev
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: job-scheduler:dev
    command: ["python", "-m", "backend.scheduler.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["full"]

  worker:
    image: job-scheduler:dev
    command: ["python", "-m", "backend.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:scheduler@postgres:5432/scheduler
      REDIS_URL: redis://redis:6379/0
      # Overridable so CI can shorten the failover reclaim window.
      CLAIM_MIN_IDLE_MS: ${CLAIM_MIN_IDLE_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    profiles: ["full"]

volumes:
  pgdata:
