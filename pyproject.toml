[project]
name = "job-scheduler"
version = "0.1.0"
description = "Distributed asynchronous job scheduler (API + scheduler + worker)"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"
